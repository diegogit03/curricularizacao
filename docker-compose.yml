services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: curricularizacao
      POSTGRES_PASSWORD: curricularizacao
      POSTGRES_DB: curricularizacao
    volumes:
      - curricularizacao-postgres-data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

volumes:
  curricularizacao-postgres-data:
